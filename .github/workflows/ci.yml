name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflows and prose
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: pinact
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0

      - name: zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false

      # ghalint publishes no action, so its binary is fetched from its own
      # release and checksummed. Version and checksum match
      # thalassa-trust/github-org, so this is one upgrade to review rather than
      # two.
      - name: ghalint
        env:
          GHALINT_VERSION: "1.5.6"
          GHALINT_SHA256: "98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${workdir}/ghalint.tar.gz" \
            "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${GHALINT_VERSION}/ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz"
          echo "${GHALINT_SHA256}  ${workdir}/ghalint.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "${workdir}/ghalint.tar.gz" --directory "${workdir}" ghalint
          "${workdir}/ghalint" run

      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c # v2.2.0

      # `--offline` resolves local paths only, so a dead external URL is not a
      # red gate on somebody else's outage.
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline .
          fail: true

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  brew:
    name: Homebrew
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # `brew audit --online` hits the GitHub API and gets rate-limited without this.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1

      # Symlink rather than `brew tap <name> <path>`, whose two-argument form
      # Homebrew has deprecated for third-party taps.
      - name: Link tap into Homebrew
        run: |
          tap_dir="$(brew --repository)/Library/Taps/thalassa-trust/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"

      - name: brew style
        run: brew style thalassa-trust/tap

      - name: brew audit
        run: brew audit --cask --online --tap thalassa-trust/tap

      # Proves the DMG mounts, the versioned .app bundle name resolves, and the
      # CLI symlink lands. Homebrew 6 refuses to load untrusted third-party
      # casks, hence the explicit trust.
      - name: Install smoke test
        run: |
          brew trust --cask thalassa-trust/tap/buskill
          brew install --cask thalassa-trust/tap/buskill
          test -d "/Applications/buskill-v0.7.0.app"
          test -x "$(brew --prefix)/bin/buskill"
          brew uninstall --cask thalassa-trust/tap/buskill

  gate:
    name: "gate:ci"
    if: always()
    needs: [workflows, brew]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every dependency to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          test -n "${RESULTS}"
          for result in ${RESULTS}; do test "${result}" = success; done
